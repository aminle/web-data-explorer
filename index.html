<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Explorer & Favorites Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Web Data Explorer</h1>
      <p>Search live API records and build your personal favorites list.</p>
    </header>

    <!-- Controls -->
    <form id="search-form" class="controls-card">
      <input type="text" id="search-input" aria-label="Search items by keyword" placeholder="Search items by keyword..." autocomplete="off">
      <button type="submit" id="search-btn">Search</button>
      <button type="button" id="reset-btn" class="btn-secondary">Clear Search</button>
    </form>

    <!-- User Feedback Message -->
    <div id="status-msg" class="status-msg" role="status"></div>
    <p id="storage-msg" class="storage-msg" role="status"></p>

    <!-- Dual-Column Dashboard -->
    <main class="dashboard-grid">
      <!-- Search Results Column -->
      <section class="panel">
        <div class="panel-header">
          <h2>Available Items</h2>
          <span class="badge" id="results-count">0 items</span>
        </div>
        <div id="results-grid" class="cards-container">
          <!-- Dynamically populated via render() in app.js -->
        </div>
      </section>

      <!-- Favorites Column -->
      <section class="panel">
        <div class="panel-header">
          <h2>My Favorites</h2>
          <span class="badge badge-accent" id="fav-counter" aria-live="polite">0 saved</span>
        </div>
        <div id="favs-list" class="cards-container">
          <!-- Dynamically populated via render() in app.js -->
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
